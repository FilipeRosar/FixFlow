# S3 local para o backend executado fora do Docker.
fixflow.attachments.enabled=true
fixflow.attachments.bucket=${S3_BUCKET:fixflow-attachments}
fixflow.attachments.region=${S3_REGION:sa-east-1}
fixflow.attachments.endpoint=${S3_ENDPOINT:http://localhost:4566}
fixflow.attachments.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:4566}
fixflow.attachments.path-style=true
fixflow.attachments.access-key=${S3_ACCESS_KEY:test}
fixflow.attachments.secret-key=${S3_SECRET_KEY:test}
