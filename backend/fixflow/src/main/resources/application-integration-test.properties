
spring.datasource.url=jdbc:postgresql://localhost:5432/fixflow_test
spring.datasource.username=${DB_USERNAME:fixflow_runtime}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/fixflow_test
spring.flyway.user=${DB_MIGRATOR_USERNAME:fixflow_migrator}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

fixflow.outbox.scheduling-enabled=false

fixflow.auth.ephemeral-keys=true
fixflow.auth.basic-enabled=true

fixflow.auth.cookie-secure=true

# Os testes HTTP usam storage simulado; o teste real do LocalStack é opt-in.
fixflow.attachments.enabled=false

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

fixflow.inventory.reconciliation.scheduling-enabled=false

fixflow.subscriptions.scheduling-enabled=false
