spring.application.name=fixflow
spring.config.import=optional:file:./application-local.properties,optional:file:./application-auth-local.properties

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fixflow}

spring.datasource.username=${DB_USERNAME:fixflow_runtime}

spring.datasource.password=${DB_PASSWORD:fixflow}

spring.datasource.driver-class-name=org.postgresql.Driver

springdoc.api-docs.path=/api-docs

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/fixflow}

spring.flyway.user=${DB_MIGRATOR_USERNAME:fixflow_migrator}

spring.flyway.password=${DB_MIGRATOR_PASSWORD}



logging.structured.format.console=logstash

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Production must provide persistent RSA PEM keys (PKCS#8 private, X.509 public).
fixflow.auth.private-key=${AUTH_PRIVATE_KEY:}
fixflow.auth.public-key=${AUTH_PUBLIC_KEY:}
fixflow.auth.key-id=${AUTH_KEY_ID:fixflow-rsa-1}
fixflow.auth.issuer=${AUTH_ISSUER:fixflow}
fixflow.auth.allowed-origin=${APP_ORIGIN:http://localhost:4200}
fixflow.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
