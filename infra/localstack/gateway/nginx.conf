events {}
http {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
    # Community LocalStack does not enforce private object ACLs on anonymous GETs.
    # Expose only signed S3 traffic; LocalStack validates the presigned signature and expiry.
    map $http_authorization $header_signed {
        default 0;
        "~^AWS4-HMAC-SHA256 " 1;
    }
    map $args $query_algorithm {
        default 0;
        "~(^|&)X-Amz-Algorithm=AWS4-HMAC-SHA256(&|$)" 1;
    }
    map $args $query_signature {
        default 0;
        "~(^|&)X-Amz-Signature=[a-fA-F0-9]{64}(&|$)" 1;
    }
    map $args $query_credential {
        default 0;
        "~(^|&)X-Amz-Credential=[^&]+" 1;
    }
    map "$header_signed:$query_algorithm:$query_signature:$query_credential" $s3_signed {
        default 0;
        "~^1:" 1;
        "0:1:1:1" 1;
    }
    server {
        listen 4566;
        server_tokens off;
        client_max_body_size 11m;
        # Do not log query strings: presigned URLs are temporary bearer credentials.
        access_log off;
        error_log /var/log/nginx/error.log crit;
        location = /health {
            return 200 'ok';
        }
        location / {
            if ($s3_signed = 0) { return 403; }
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 60s;
            set $s3_upstream localstack:4566;
            proxy_pass http://$s3_upstream;
        }
    }
}
