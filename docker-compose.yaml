services:
  postgres:
    image: postgres:17
    container_name: fixflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixflow
      POSTGRES_USER: fixflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fixflow}
    ports:
      - "5432:5432"
    volumes:
      - fixflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow -d fixflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  localstack:
    image: docker.io/localstack/localstack:4.5
    container_name: fixflow-localstack
    entrypoint: ["/etc/fixflow-localstack-entrypoint.sh"]
    stop_grace_period: 60s
    restart: unless-stopped
    environment:
      SERVICES: s3
      EAGER_SERVICE_LOADING: "1"
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${S3_REGION:-sa-east-1}
      S3_BUCKET: ${S3_BUCKET:-fixflow-attachments}
    volumes:
      - fixflow_localstack_data:/var/lib/localstack
      - ./infra/localstack/entrypoint.sh:/etc/fixflow-localstack-entrypoint.sh:ro,Z
      - ./infra/localstack/ready.d:/etc/localstack/init/ready.d:ro,Z
    healthcheck:
      test: ['CMD-SHELL', 'grep -qx ready /tmp/fixflow-s3-ready && awslocal s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  localstack-gateway:
    image: docker.io/library/nginx:alpine
    container_name: fixflow-localstack-gateway
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^NGINX_LOCAL_RESOLVERS$
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./infra/localstack/gateway/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro,Z
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4566/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./backend/fixflow
      dockerfile: Dockerfile
    container_name: fixflow-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fixflow
      SPRING_DATASOURCE_USERNAME: ${DB_RUNTIME_USERNAME:-fixflow_runtime}
      SPRING_DATASOURCE_PASSWORD: ${DB_RUNTIME_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/fixflow
      SPRING_FLYWAY_USER: ${DB_MIGRATOR_USERNAME:-fixflow_migrator}
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      FILE_STORAGE_ROOT: /app/storage
      ATTACHMENTS_ENABLED: ${ATTACHMENTS_ENABLED:-true}
      S3_BUCKET: ${S3_BUCKET:-fixflow-attachments}
      S3_REGION: ${S3_REGION:-sa-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack-gateway:4566}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      S3_PATH_STYLE: "true"
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@fixflow.local}
    volumes:
      - fixflow_private_files:/app/storage
    ports:
      - "8080:8080"
    depends_on:
      localstack-gateway:
        condition: service_healthy
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  fixflow_postgres_data:
  fixflow_private_files:
  fixflow_localstack_data:
